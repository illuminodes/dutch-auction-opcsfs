[package]
name = "dutch-auction-ctv-csfs"
version = "0.1.0"
edition = "2024"

[dependencies]
bitcoin = "0.32.7"
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
bdk_wallet = { version = "1.2.0", features = ["keys-bip39"] }
bdk_esplora = { version = "0.20.1", features = ["async-https-rustls", "tokio"], default-features = false }

# Async  
tokio = { version = "1.0", features = ["full", "test-util", "time"] }
nostro2 = "0.3.9"
nostro2-signer = "0.1.11"
thiserror = "2.0.17"

